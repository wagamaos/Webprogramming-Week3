<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background-color: #3b82f6;
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 16px auto;
    }

    .name {
      font-size: 1.25rem;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .role {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 20px 0;
    }

    .skills {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      background-color: #eff6ff;
      color: #3b82f6;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">K</div>
    <h2 class="name">Kim Jisoo</h2>
    <p class="role">Web Programming Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</body>
</html>
