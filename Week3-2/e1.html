<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      width: 280px;
      height: 180px;
      background-color: white;
      border: 2px solid #0d9488;
      border-radius: 12px;
      position: relative;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #0d9488;
      color: white;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.05em;
      border-radius: 9999px;
    }

    .card h3 {
      margin: 0 0 8px 0;
      color: #1f2937;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0;
      color: #6b7280;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <h3>Special Offer</h3>
    <p>Get up to 50% off on selected items this week.</p>
  </div>
</body>
</html>
