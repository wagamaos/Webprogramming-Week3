<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My CSS Advanced Page</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #1e293b;
    --border: #e2e8f0;
    --radius: 12px;
    --nav-bg: rgba(255, 255, 255, 0.9);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #3b82f6;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --border: #334155;
      --nav-bg: rgba(15, 23, 42, 0.9);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: 60px;
    transition: background 0.3s, color 0.3s;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: var(--nav-bg);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    z-index: 1000;
  }

  nav span {
    font-weight: bold;
    color: var(--primary);
  }

  nav div {
    display: flex;
    gap: 1.5rem;
  }

  nav a {
    color: var(--text);
    text-decoration: none;
    transition: color 0.2s;
  }

  nav a:hover {
    color: var(--primary);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero {
    text-align: center;
    padding: 6rem 1rem 4rem;
    animation: fadeIn 0.8s ease-out forwards;
  }

  .hero h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }

  .hero p {
    color: var(--text);
    opacity: 0.8;
  }

  .skills-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem 6rem;
  }

  .sticky-h2 {
    position: sticky;
    top: 70px;
    background: var(--bg);
    padding: 1rem 0;
    font-size: 1.75rem;
    z-index: 10;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 2rem;
    border-radius: var(--radius);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  .card[data-icon]::before {
    content: attr(data-icon) ' ';
    font-size: 2rem;
    display: block;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <nav>
    <span>Kim Jisoo</span>
    <div>
      <a href="#">Home</a>
      <a href="#skills">Skills</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Kim Jisoo</h1>
    <p>Computer Science · Gachon University · Week 3 CSS Advanced</p>
  </section>

  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🌐">HTML5</div>
      <div class="card" data-icon="🎨">CSS3</div>
      <div class="card" data-icon="⚡">JavaScript</div>
    </div>
  </section>
</body>
</html>
