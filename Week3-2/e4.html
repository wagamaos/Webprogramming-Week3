<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  :root {
    --primary: #2563eb;
    --accent: #3b82f6;
    --bg: #f8fafc;
    --text: #1e293b;
    --card-bg: #ffffff;
    --radius: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #3b82f6;
      --accent: #60a5fa;
      --bg: #0f172a;
      --text: #f1f5f9;
      --card-bg: #1e293b;
    }
  }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: sans-serif; 
    padding: 20px; 
    transition: background 0.3s, color 0.3s;
  }

  .btn {
    background: var(--primary);
    color: white; 
    border: none; 
    padding: 10px 20px; 
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: bold;
    transition: opacity 0.2s;
  }

  .btn:hover {
    opacity: 0.9;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px; 
    margin-top: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }
</style>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
