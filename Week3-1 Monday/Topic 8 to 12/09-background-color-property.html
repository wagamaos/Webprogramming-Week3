<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Color Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .banner {
      background-color: #15803d;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
    }
    .warning {
      background-color: #fef3c7;
      color: #92400e;
      padding: 12px 16px;
      border-left: 4px solid #f59e0b;
      margin-top: 15px;
    }
    .dark-card {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="banner">Green banner — white text</div>
  <div class="warning">⚠ Warning box — amber background</div>
  <div class="dark-card">Dark card — light text</div>
</body>
</html>
