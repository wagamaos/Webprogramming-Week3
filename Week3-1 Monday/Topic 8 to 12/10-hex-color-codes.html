<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Colors Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .red    { background-color: #FF0000; color: white; }
    .green  { background-color: #00FF00; }
    .blue   { background-color: #0000FF; color: white; }
    .white  { background-color: #FFFFFF; border: 1px solid #ccc; }
    .black  { background-color: #000000; color: white; }
    .custom { background-color: #10B981; color: white; }
    .short-red { background-color: #F00; color: white; }
    div { padding: 8px 16px; margin: 4px; display: inline-block; font-weight: bold; }
  </style>
</head>
<body>
  <div class="red">#FF0000 Red</div>
  <div class="green">#00FF00 Green</div>
  <div class="blue">#0000FF Blue</div>
  <div class="white">#FFFFFF White</div>
  <div class="black">#000000 Black</div>
  <div class="custom">#10B981 Emerald</div>
  <div class="short-red">#F00 (shorthand)</div>
</body>
</html>
