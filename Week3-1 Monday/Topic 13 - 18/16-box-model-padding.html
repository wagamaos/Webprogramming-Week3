<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Padding Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .box {
      background: #ecfdf5;
      border: 2px solid #10B981;
      width: 300px;
      margin-bottom: 15px;
    }
    .p-none   { padding: 0; }
    .p-all    { padding: 20px; }
    .p-tb-lr  { padding: 10px 40px; }
    .label {
      font-size: 11px;
      color: #059669;
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box p-none"><span class="label">padding: 0</span>Content here</div>
  <div class="box p-all"><span class="label">padding: 20px</span>Content here</div>
  <div class="box p-tb-lr"><span class="label">padding: 10px 40px</span>Content here</div>
</body>
</html>
