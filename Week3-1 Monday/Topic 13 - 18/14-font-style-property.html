<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Style Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .normal  { font-style: normal; }
    .italic  { font-style: italic; }
    .oblique { font-style: oblique; }
    blockquote {
      font-style: italic;
      color: #64748b;
      border-left: 3px solid #10B981;
      padding-left: 16px;
      margin: 15px 0;
    }
    .caption {
      font-style: italic;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <p class="normal">Normal — upright text</p>
  <p class="italic">Italic — true italic letterforms</p>
  <p class="oblique">Oblique — artificially slanted</p>
  <br>
  <blockquote>"CSS is the language of the web's visual layer."</blockquote>
  <p class="caption">Figure 1: Example of a styled blockquote</p>
</body>
</html>
