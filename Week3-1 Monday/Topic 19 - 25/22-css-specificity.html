<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Specificity Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    p              { color: gray; }
    .intro         { color: blue; }
    #main          { color: green; }
    p.intro        { color: purple; }
    #main p        { color: orange; }
  </style>
</head>
<body>
  <p>Gray paragraph (type selector match)</p>
  <p class="intro">Blue paragraph (class selector match)</p>
  <div id="main">
    <p>Orange paragraph (#main p selector match, beats other rules)</p>
  </div>
</body>
</html>
