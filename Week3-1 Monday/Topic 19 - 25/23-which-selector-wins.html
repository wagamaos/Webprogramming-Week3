<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selector Precedence Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    p           { color: gray; }
    .highlight  { color: blue; }
    p.highlight { color: purple; }
    #note       { color: green; }
    div p       { font-style: italic; }
    div .highlight { font-weight: bold; }
  </style>
</head>
<body>
  <div>
    <p>Plain paragraph — gray</p>
    <p class="highlight">P with class — purple (p.highlight wins)</p>
    <p class="highlight" id="note">P with class AND id — green (#note wins)</p>
  </div>
</body>
</html>
