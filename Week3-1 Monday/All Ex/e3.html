<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #fdf2f8, #ecfeff, #f5f3ff);
      padding: 30px;
    }

    .palette {
      display: flex;
      gap: 12px;
      padding: 16px;
      background-color: rgba(255,255,255,0.75);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }

    .swatch {
      width: 110px;
      height: 110px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 10px;
    }

    .c1 { background-color: #ef4444; }
    .c2 { background-color: #f97316; }
    .c3 { background-color: #14b8a6; }
    .c4 { background-color: #3b82f6; }
    .c5 { background-color: #8b5cf6; }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="title">Wang Yi Heng • Singapore • 202699474</div>
  <div class="palette">
    <div class="swatch c1">WYH</div>
    <div class="swatch c2">SG</div>
    <div class="swatch c3">2026</div>
    <div class="swatch c4">CSS</div>
    <div class="swatch c5">WEB</div>
  </div>
</body>
</html>
