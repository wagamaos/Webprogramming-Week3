<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ed, #ecfeff, #f5f3ff);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid #f59e0b;
      border-radius: 18px;
      padding: 32px 40px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      color: #b45309;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    p {
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 0;
    }

    .meta {
      margin-top: 14px;
      font-weight: bold;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wang Yi Heng</h1>
    <p>I am exploring CSS design with creativity and confidence.</p>
    <p class="meta">Admin No: 202699474 | Country: Singapore</p>
  </div>
</body>
</html>
