<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #12081f, #2d1b69, #0f172a);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
    }

    .card {
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
    }

    .avatar {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #f97316, #ec4899, #8b5cf6);
      color: white;
      font-size: 34px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 18px auto;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
      transform: rotate(-8deg);
    }

    .name {
      font-size: 1.5rem;
      color: #fef3c7;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .role {
      font-size: 0.9rem;
      color: #c4b5fd;
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }

    hr {
      border: none;
      border-top: 2px dashed rgba(255,255,255,0.25);
      margin: 20px 0;
    }

    .skills {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      background: linear-gradient(135deg, #22d3ee, #34d399);
      color: #0f172a;
      padding: 7px 13px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
      border: 1px solid rgba(15, 23, 42, 0.15);
    }

    .meta {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #e2e8f0;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">W</div>
    <h2 class="name">Wang Yi Heng</h2>
    <p class="role">Creative Explorer</p>
    <hr>
    <div class="skills">
      <span class="badge">Singapore</span>
      <span class="badge">202699474</span>
      <span class="badge">CSS</span>
    </div>
    <div class="meta">Designing with color, shape, and curiosity.</div>
  </div>
</body>
</html>
