<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      padding: 30px;
      color: #1f2937;
    }

    h2 {
      color: #0369a1;
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .info {
      color: #7c3aed;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h2>Wang Yi Heng</h2>
  <p class="info">Admin No: 202699474 | Singapore</p>
  <p style="color: #7c3aed;">This paragraph uses inline CSS to highlight my personal details in purple.</p>
  <p>Learning CSS is helping me build more interactive and attractive web pages.</p>
</body>
</html>
