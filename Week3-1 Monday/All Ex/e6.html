<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #fdf2f8, #ecfeff);
    }

    nav {
      background: linear-gradient(90deg, #111827, #1f2937, #0f172a);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 30px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
    }

    .logo {
      color: #f8fafc;
      font-weight: 800;
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 0.08em;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #2dd4bf;
    }

    .banner {
      padding: 80px 30px;
      text-align: center;
      color: #1f2937;
    }

    .banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .banner p {
      font-size: 1.1rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="logo">WYH</a>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Admin</a>
      <a href="#">Singapore</a>
    </div>
  </nav>

  <div class="banner">
    <h1>Wang Yi Heng</h1>
    <p>Admin No: 202699474 | Country: Singapore</p>
  </div>
</body>
</html>
