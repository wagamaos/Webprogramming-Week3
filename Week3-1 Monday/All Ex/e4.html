<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #fef3c7, #dbeafe, #ecfccb);
    }

    .margin-box {
      background-color: #fef9c3;
      padding: 30px;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      border: 3px solid #f59e0b;
      border-radius: 18px;
    }

    .border-box {
      background-color: #c7d2fe;
      padding: 22px;
      border: 3px solid #4338ca;
      border-radius: 14px;
    }

    .padding-box {
      background-color: #bbf7d0;
      padding: 24px;
      border: 3px solid #16a34a;
      border-radius: 12px;
    }

    .content-box {
      background-color: #fbcfe8;
      padding: 22px;
      border: 3px solid #db2777;
      border-radius: 10px;
      color: #4c1d95;
      font-weight: 700;
    }

    .layer-label {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #1f2937;
    }

    .personal {
      margin-top: 20px;
      text-align: center;
      font-size: 1.15rem;
      color: #1f2937;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="margin-box">
    <span class="layer-label">Margin</span>
    <div class="border-box">
      <span class="layer-label">Border</span>
      <div class="padding-box">
        <span class="layer-label">Padding</span>
        <div class="content-box">
          <span class="layer-label">Content</span>
        </div>
      </div>
    </div>
  </div>
  <div class="personal">Wang Yi Heng • Admin 202699474 • Singapore</div>
</body>
</html>
