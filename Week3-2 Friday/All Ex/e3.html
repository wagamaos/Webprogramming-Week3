<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    background: linear-gradient(135deg, #fff7ed, #ecfeff);
    font-family: sans-serif;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .spinner-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .spinner {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 5px solid #ddd6fe;
    border-top-color: #7c3aed;
    animation: spin 0.9s linear infinite;
  }

  .label {
    font-size: 0.9rem;
    color: #4c1d95;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div class="label">WYH</div>
  </div>
</body>
</html>
