<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #fef2f2, #ede9fe, #ecfeff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      width: 310px;
      height: 190px;
      background: rgba(255,255,255,0.8);
      border: 2px solid #8b5cf6;
      border-radius: 18px;
      position: relative;
      padding: 26px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(91, 33, 182, 0.12);
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.08em;
      border-radius: 9999px;
    }

    .card h3 {
      margin: 0 0 8px 0;
      color: #4c1d95;
      font-size: 1.2rem;
    }

    .card p {
      margin: 0;
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .meta {
      margin-top: 10px;
      font-weight: 700;
      color: #7c3aed;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PROFILE</span>
    <h3>Wang Yi Heng</h3>
    <p>Admin Number: 202699474<br>Country: Singapore</p>
    <div class="meta">Creative CSS learner</div>
  </div>
</body>
</html>
