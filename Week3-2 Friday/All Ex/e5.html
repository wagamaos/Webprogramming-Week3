<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; }

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(90deg, #111827, #312e81, #1d4ed8);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    z-index: 1000;
    box-shadow: 0 8px 20px rgba(17, 24, 39, 0.15);
  }

  .nav-logo {
    color: white;
    font-weight: bold;
    text-decoration: none;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
  }

  .nav-links {
    display: flex;
    gap: 24px;
  }

  .nav-links a {
    color: #e2e8f0;
    text-decoration: none;
    transition: color 0.2s ease;
    font-weight: 600;
  }

  .nav-links a:hover {
    color: #67e8f9;
  }

  .content { padding-top: 70px; }
  .section  { height: 300px; padding: 40px; font-size: 18px; }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="nav-logo">WYH</a>
    <div class="nav-links">
      <a href="#s1">Home</a>
      <a href="#s2">Profile</a>
      <a href="#s3">Admin</a>
    </div>
  </nav>
  <div class="content">
    <div class="section" id="s1" style="background:#ecfeff">Section 1 — Wang Yi Heng</div>
    <div class="section" id="s2" style="background:#dbeafe">Section 2 — Admin No: 202699474</div>
    <div class="section" id="s3" style="background:#e0f2fe">Section 3 — Singapore</div>
  </div>
</body>
</html>
