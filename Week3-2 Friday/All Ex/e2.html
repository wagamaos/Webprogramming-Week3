<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    padding: 40px;
    background: linear-gradient(135deg, #f0fdfa, #ecfeff, #fdf2f8);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }

  .card {
    background: rgba(255,255,255,0.9);
    border: 2px solid #14b8a6;
    border-radius: 18px;
    padding: 26px 28px;
    width: 300px;
    color: #0f766e;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 18px 30px -8px rgba(20, 184, 166, 0.3);
    background: #ccfbf1;
  }

  .card small {
    display: block;
    margin-top: 8px;
    font-size: 0.8rem;
    color: #334155;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    Wang Yi Heng
    <small>Admin No: 202699474 · Singapore</small>
  </div>
</body>
</html>
